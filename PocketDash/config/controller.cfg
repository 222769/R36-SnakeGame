# ===========================================================================
#  Pocket Dash - controller configuration
# ===========================================================================
#
# R36S firmware images expose the controls as an SDL joystick, but the
# button NUMBERS differ between ArkOS / AmberELEC / clone images. Set them
# here - no recompiling needed.
#
# How to find your button numbers:
#   1. Start the game and press SELECT + L1 (or F1 on a PC, or set
#      DEBUG_OVERLAY=1 below) to show the debug overlay.
#   2. Hold a button: its number appears on the "BTN" line.
#   3. Write that number next to the matching action below.
#   The game log (log.txt next to the launcher on ArkOS) also lists the
#   joystick name, button/axis/hat counts and SDL's own mapping string.
#
# Use -1 to disable a binding.
# Quit at any time by holding SELECT + START.
# ---------------------------------------------------------------------------

# Face buttons (A = hop / confirm, B = dash / back, X = power-up, Y = interact)
A=1
B=0
X=2
Y=3

# Shoulders
L1=4
R1=5
L2=6
R2=7

# Menu buttons
SELECT=12
START=13

# D-pad reported as buttons (ArkOS "GO-Super Gamepad" style).
# If your d-pad is reported as a hat instead, these can stay as they are:
# USE_HAT=1 below handles hats automatically.
DPAD_UP=8
DPAD_DOWN=9
DPAD_LEFT=10
DPAD_RIGHT=11
USE_HAT=1

# Left analogue stick
AXIS_X=0
AXIS_Y=1
INVERT_X=0
INVERT_Y=0
# 0..32000 - raise this if the character drifts with the stick released.
DEADZONE=8000

# Show the debug overlay at startup (handy when mapping a new device).
DEBUG_OVERLAY=0

# ---------------------------------------------------------------------------
# Keyboard (PC development). Comma-separated SDL key names.
# Default: arrows to move, Z/X/A/S for the A/B/X/Y buttons.
# ---------------------------------------------------------------------------
KEY_UP=Up
KEY_DOWN=Down
KEY_LEFT=Left
KEY_RIGHT=Right
KEY_A=Z, Space
KEY_B=X, Left Shift
KEY_X=A
KEY_Y=S
KEY_L1=Q
KEY_R1=W
KEY_L2=1
KEY_R2=2
KEY_START=Return, Escape
KEY_SELECT=Backspace, Tab

# Alternative WASD layout (A and S are movement here, so the face buttons
# move to J/K/L/I). Uncomment these lines to use it:
# KEY_UP=W, Up
# KEY_DOWN=S, Down
# KEY_LEFT=A, Left
# KEY_RIGHT=D, Right
# KEY_A=J, Z, Space
# KEY_B=K, X
# KEY_X=L
# KEY_Y=I
# KEY_L1=Q
# KEY_R1=E

# ---------------------------------------------------------------------------
# Other common layouts (copy the numbers over the ones above):
#
# Example layout from the original spec:
#   A=0  B=1  X=2  Y=3  L1=4  R1=5  START=6  SELECT=7
#
# Xbox-style USB pad on Linux (d-pad is a hat):
#   A=0  B=1  X=2  Y=3  L1=4  R1=5  SELECT=6  START=7
#   DPAD_UP=-1 DPAD_DOWN=-1 DPAD_LEFT=-1 DPAD_RIGHT=-1  USE_HAT=1
# ---------------------------------------------------------------------------
